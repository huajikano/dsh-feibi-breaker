# feibi-breaker bundle patch: one Loader row for this package.
#
# The row carries no `config`: every field has a default, and a deployment that
# wants different tuning overrides this row by id in its own profile patch:
#
#   - id: feibi-breaker
#     config:
#       dualLayer: false
#       interceptAt: preview
#       onDetect: ask
#
# The host identity override below is applied by the installer, not by this
# file: a bundle patch that rewrote `system-prompt` would fight any other bundle
# doing the same. `scripts/lib/patcher.js` writes it once, idempotently.

- insert:
    - id: feibi-breaker
      name: 'feibi-breaker'
      config:
        armorEnabled: true
        dualLayer: true
        enabled: true
        interceptAt: stream
        onDetect: block
        scanReasoning: false
        scanToolArgs: false
        dryRun: false
