# feibi-breaker bundle patch: one Loader row for this package.
#
# The row carries no `config`: every field has a default, and a deployment that
# wants different tuning overrides this row **by id** in its own profile patch:
#
#   - id: feibi-breaker
#     config:
#       dualLayer: false
#       interceptAt: preview
#       onDetect: ask
#
# Do not add an `- insert:` row for this plugin to a profile patch. The bundle
# already inserts this entry, and DSH 0.2.x does not deduplicate inserts: a
# second row mounts a second fiber, so `apply()` runs twice and every route,
# timer and projection is registered twice.
#
# 1.1.x also rewrote the host identity (`- id: system-prompt` with
# `includeHarnessIdentity: false`) from its installer. That override is
# profile-wide and fights every other plugin that supplies a persona, so 1.2.0
# leaves it to the deployment: write it yourself if you actually want it.

- insert:
    - id: feibi-breaker
      name: 'feibi-breaker'
      config:
        armorEnabled: true
        dualLayer: true
        enabled: true
        interceptAt: stream
        onDetect: block
        scanReasoning: false
        scanToolArgs: false
        dryRun: false
